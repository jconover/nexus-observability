global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alerting rules
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape rag-backend over the shared ai-stack network.
  # Using container_name (rag-backend) rather than service name (backend) because
  # service names are only DNS-resolvable on the owning project's default network;
  # container names are resolvable on any attached network.
  - job_name: 'rag-backend'
    static_configs:
      - targets: ['rag-backend:8000']
    metrics_path: '/metrics/'

  # NVIDIA GPU metrics from dcgm-exporter (optional - requires gpu-monitoring profile)
  # Enable with: make start-gpu  (or: docker compose --profile gpu-monitoring up -d)
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['dcgm-exporter:9400']
    scrape_interval: 15s
    honor_labels: true
